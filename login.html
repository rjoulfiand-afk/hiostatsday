<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Access - HIO STATSDAY</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔥 SUNTIKAN FIREBASE SDK 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --text-dark: #0f172a; --text-soft: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.65); --glass-border: rgba(255, 255, 255, 0.9);
            --accent-1: #a1c4fd; --accent-2: #c2e9fb; --accent-vip: #ff9a9e;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent;}

        body {
            color: var(--text-dark); min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
            background: linear-gradient(-45deg, #f5f7fa, #c3cfe2, #e0c3fc, #8ec5fc);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; overflow: hidden;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Blobs Background (Aura Hologram) */
        .blob { position: fixed; filter: blur(80px); z-index: -1; opacity: 0.6; border-radius: 50%; animation: floatBlob 10s ease-in-out infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #e0c3fc; }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #8ec5fc; animation-delay: -5s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

        /* Kotak Login 3D Glassmorphism */
        .login-box {
            width: 100%; max-width: 400px;
            background: var(--glass-bg); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border); border-radius: 40px; padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(162, 171, 189, 0.4), inset 0 0 0 1px rgba(255,255,255,1);
            animation: smoothFadeUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            position: relative; text-align: center;
        }
        @keyframes smoothFadeUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }

        /* Ikon Gembok Premium */
        .lock-icon {
            width: 80px; height: 80px; margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 35px; color: #fff; border: 4px solid #fff;
            box-shadow: 0 15px 35px rgba(161, 196, 253, 0.5);
            animation: floatLock 3s ease-in-out infinite;
        }
        @keyframes floatLock { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .login-box h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .login-box p { font-size: 13px; font-weight: 600; color: var(--text-soft); margin-bottom: 35px; }

        /* Input 3D Style */
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-soft); font-size: 16px; transition: var(--transition); }
        .form-control {
            width: 100%; background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
            padding: 16px 15px 16px 50px; font-weight: 600; font-size: 14px;
            color: var(--text-dark); transition: var(--transition); outline: none;
        }
        .form-control:focus { background: #ffffff; border-color: transparent; box-shadow: 0 0 0 4px rgba(161, 196, 253, 0.25); transform: translateY(-2px); }
        .form-control:focus + i { color: var(--accent-1); }

        /* Tombol Sakti */
        .btn-login {
            width: 100%; padding: 18px; margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #0f172a; border: none; border-radius: 20px;
            font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition);
            box-shadow: 0 15px 30px rgba(161, 196, 253, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-login:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(161, 196, 253, 0.6); }

        .bot-link { display: block; margin-top: 25px; font-size: 12px; font-weight: 700; color: var(--text-soft); text-decoration: none; }
        .bot-link span { color: #3b82f6; text-decoration: underline; }

        /* Notifikasi Error */
        #errorMsg { color: #ef4444; font-size: 12px; font-weight: 700; margin-top: 15px; display: none; background: #fee2e2; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-box">
        <div class="lock-icon"><i class="fas fa-fingerprint"></i></div>
        <h1>Akses System</h1>
        <p>Gunakan Username & Password dari Bot</p>

        <form id="formLogin">
            <div class="input-group">
                <input type="text" id="inUname" class="form-control" placeholder="Username (ex: HIO_Kayy)" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="password" id="inPass" class="form-control" placeholder="Password dari Telegram" required>
                <i class="fas fa-key"></i>
            </div>
            
            <button type="submit" class="btn-login" id="btnMasuk">
                <span>Masuk Sekarang</span> <i class="fas fa-sign-in-alt"></i>
            </button>
            <div id="errorMsg"><i class="fas fa-exclamation-triangle"></i> Username atau Password salah lur!</div>
        </form>

        <a href="#" class="bot-link">Belum punya akses? <span>Minta ke Bot Telegram</span></a>
    </div>

    <script>
        // 🔥 SETUP FIREBASE BOSS JUL 🔥
        const firebaseConfig = {
            apiKey: "AIzaSyBuAbkyL3pyvPNWG9u3EyPyhdQn4y7blkc",
            authDomain: "juldev-command-center.firebaseapp.com",
            databaseURL: "https://juldev-command-center-default-rtdb.firebaseio.com",
            projectId: "juldev-command-center",
            storageBucket: "juldev-command-center.firebasestorage.app",
            messagingSenderId: "859594134847",
            appId: "1:859594134847:web:83a11af82db0095bd22f8a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let uname = document.getElementById('inUname').value.trim();
            let pass = document.getElementById('inPass').value.trim();
            let btn = document.getElementById('btnMasuk');
            let errorMsg = document.getElementById('errorMsg');

            // Bikin tombol loading biar keliatan pro
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
            errorMsg.style.display = 'none';

            // ⚡ LOGIKA SAKTI NYARI DATA DI FIREBASE ⚡
            // Bot Python nanti wajib nyimpen data pendaftar di path: "users/NamaUser"
            db.ref('users/' + uname).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    let dataAkun = snapshot.val();
                    
                    // Cek apakah password dari input cocok sama password di database
                    if (dataAkun.password === pass) {
                        
                        // KASIH KARCIS VIP (Simpan di LocalStorage HP/PC anak itu)
                        localStorage.setItem('hio_session_user', uname);
                        localStorage.setItem('hio_session_role', dataAkun.role); // Simpen jabatannya sekalian
                        
                        // Lempar ke halaman HIO Utama
                        window.location.href = "hio.html"; 

                    } else {
                        // Password salah
                        errorMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Password salah boss!';
                        errorMsg.style.display = 'block';
                        btn.innerHTML = '<span>Masuk Sekarang</span> <i class="fas fa-sign-in-alt"></i>';
                    }
                } else {
                    // Username ngga ketemu di Firebase
                    errorMsg.innerHTML = '<i class="fas fa-user-times"></i> Username tidak ditemukan! Minta ke Bot dulu.';
                    errorMsg.style.display = 'block';
                    btn.innerHTML = '<span>Masuk Sekarang</span> <i class="fas fa-sign-in-alt"></i>';
                }
            }).catch((error) => {
                errorMsg.innerHTML = 'Gagal konek ke Server!';
                errorMsg.style.display = 'block';
                btn.innerHTML = '<span>Masuk Sekarang</span> <i class="fas fa-sign-in-alt"></i>';
            });
        });

        // CEK KARCIS: Kalau udah pernah login, ngga usah nampil halaman login lagi!
        window.onload = function() {
            if(localStorage.getItem('hio_session_user')) {
                window.location.href = "hio.html"; // Langsung lempar ke dalam
            }
        }
    </script>
</body>
</html>
