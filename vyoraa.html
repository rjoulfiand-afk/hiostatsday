<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Rekrutmen - HIO STATSDAY</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔥 FIREBASE SDK 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root {
            /* 🌌 TEMA KEMBALI KE HIO.HTML (PASTEL BRIGHT GLASSMORPHISM) */
            --text-dark: #1e293b;
            --text-soft: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --accent-1: #a1c4fd; /* Soft Blue */
            --accent-2: #c2e9fb; /* Light Cyan */
            --accent-3: #e0c3fc; /* Soft Purple */
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 70px 20px 40px; /* Jarak atas dilonggarin buat foto */
            background: linear-gradient(-45deg, #f5f7fa, #c3cfe2, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden; overflow-y: auto;
            position: relative;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        /* Blobs Efek Bokeh/Blur Ala hio.html */
        .blob { position: fixed; filter: blur(80px); z-index: -1; opacity: 0.6; border-radius: 50%; animation: floatBlob 10s ease-in-out infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #e0c3fc; }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #8ec5fc; animation-delay: -5s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

        /* Container Formulir Pro & Bright */
        .form-container {
            width: 100%; max-width: 650px; 
            background: var(--glass-bg);
            backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border);
            border-radius: 40px; padding: 65px 45px 45px;
            box-shadow: 0 30px 60px rgba(162, 171, 189, 0.4), inset 0 0 0 1px rgba(255,255,255,1);
            position: relative; z-index: 1;
            animation: smoothFadeUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }
        @keyframes smoothFadeUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }

        /* 🔥 AVATAR FOTO (HIO.JPG) MELAYANG - TEMA TERANG 🔥 */
        .avatar-glow {
            width: 115px; height: 115px;
            position: absolute; top: -57px; left: 50%; transform: translateX(-50%);
            border-radius: 50%; padding: 5px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            box-shadow: 0 15px 35px rgba(161, 196, 253, 0.5), inset 0 2px 5px rgba(255,255,255,1);
            animation: floatAvatar 4s ease-in-out infinite;
            z-index: 10;
        }
        .avatar-glow img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid #ffffff; background: #fff;
        }
        @keyframes floatAvatar { 
            0%, 100% { transform: translate(-50%, 0); } 
            50% { transform: translate(-50%, -10px); box-shadow: 0 25px 45px rgba(161, 196, 253, 0.6), inset 0 2px 5px rgba(255,255,255,1); } 
        }

        /* Header Elegan Terang */
        .header { text-align: center; margin-bottom: 35px; }
        .header-badge {
            display: inline-block; background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
            color: #fff; font-size: 10px; font-weight: 800; padding: 6px 16px;
            border-radius: 20px; letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 15px; box-shadow: 0 8px 20px rgba(161, 196, 253, 0.4);
        }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; letter-spacing: 0.5px;}
        .header p { font-size: 13px; font-weight: 600; color: var(--text-soft); }

        /* Grid Form */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px; }
        .form-row-full { grid-template-columns: 1fr; margin-bottom: 22px; }

        /* Style Input Terang & Premium */
        .input-group label {
            display: block; font-size: 11px; font-weight: 800; margin-bottom: 8px;
            color: var(--text-soft); padding-left: 5px; text-transform: uppercase; letter-spacing: 1px;
        }
        
        .input-wrapper { position: relative; }
        
        .input-wrapper i.icon-left {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(135deg, var(--accent-1), #8ec5fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 16px; transition: var(--transition); z-index: 2;
        }

        .form-control {
            width: 100%; background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
            padding: 16px 15px 16px 48px; 
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600;
            color: var(--text-dark); transition: var(--transition); outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        
        .form-control::placeholder { color: #94a3b8; font-weight: 500; }
        
        /* Animasi Fokus Glow Cerah */
        .form-control:focus {
            background: #ffffff; border-color: transparent;
            box-shadow: 0 0 0 4px rgba(161, 196, 253, 0.25), 0 10px 20px rgba(161, 196, 253, 0.15);
            transform: translateY(-2px);
        }
        .form-control:focus + i.icon-left, .input-wrapper:focus-within i.icon-left { 
            transform: translateY(-50%) scale(1.15); 
        }

        textarea.form-control { padding-top: 18px; resize: none; height: 110px; }
        .textarea-wrapper i.icon-left { top: 25px; }

        select.form-control { appearance: none; cursor: pointer; }
        .select-arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; font-size: 12px; }

        /* Tombol Submit Cerah Ala hio.html */
        .btn-submit {
            width: 100%; margin-top: 10px; padding: 18px;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            color: #0f172a; border: none; border-radius: 20px;
            font-size: 15px; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition);
            box-shadow: 0 15px 30px rgba(161, 196, 253, 0.4), inset 0 2px 0 rgba(255,255,255,0.6);
            display: flex; justify-content: center; align-items: center; gap: 12px;
            position: relative; overflow: hidden;
        }
        
        /* Efek Kilap / Shine Sweep */
        .btn-submit::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: all 0.6s ease;
        }
        .btn-submit:hover::after { left: 100%; }
        .btn-submit:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(161, 196, 253, 0.6); }
        .btn-submit:active { transform: translateY(1px); box-shadow: 0 5px 15px rgba(161, 196, 253, 0.4); }

        /* Responsif HP */
        @media screen and (max-width: 600px) {
            body { padding: 70px 15px 30px; }
            .form-container { padding: 65px 25px 35px; border-radius: 35px; }
            .form-row { grid-template-columns: 1fr; gap: 15px; margin-bottom: 15px; } 
            .header h1 { font-size: 26px; }
            .avatar-glow { width: 95px; height: 95px; top: -47px; } 
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="form-container">
        
        <!-- FOTO PROFIL MELAYANG -->
        <div class="avatar-glow">
            <img src="hio.jpg" alt="HIO Profile">
        </div>

        <!-- Header -->
        <div class="header">
            <div class="header-badge">Open Recruitment</div>
            <h1>Join HIO STATSDAY</h1>
            <p>Formulir Registrasi Calon Eksekutif & Staff</p>
        </div>

        <!-- Form Area -->
        <form id="regForm">
            
            <div class="form-row">
                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <div class="input-wrapper">
                        <input type="text" id="inNama" class="form-control" placeholder="Nama asli kamu" required>
                        <i class="fas fa-user icon-left"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label>Username Tele</label>
                    <div class="input-wrapper">
                        <input type="text" id="inUname" class="form-control" placeholder="@username" required>
                        <i class="fab fa-telegram-plane icon-left"></i>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Usia</label>
                    <div class="input-wrapper">
                        <input type="number" id="inUmur" class="form-control" placeholder="Contoh: 18" required>
                        <i class="fas fa-calendar-alt icon-left"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label>Pilih Posisi</label>
                    <div class="input-wrapper">
                        <select id="inRole" class="form-control" required>
                            <option value="" disabled selected>Pilih divisi...</option>
                            <option value="Admin System">Admin System</option>
                            <option value="Staff Divisi">Staff Divisi</option>
                        </select>
                        <i class="fas fa-briefcase icon-left"></i>
                        <i class="fas fa-chevron-down select-arrow"></i>
                    </div>
                </div>
            </div>

            <div class="form-row form-row-full">
                <div class="input-group">
                    <label>Waktu Operasional</label>
                    <div class="input-wrapper">
                        <input type="text" id="inJam" class="form-control" placeholder="Contoh: Malam hari (19.00 - 23.00 WIB)" required>
                        <i class="fas fa-clock icon-left"></i>
                    </div>
                </div>
            </div>

            <div class="form-row form-row-full">
                <div class="input-group">
                    <label>Visi & Alasan Bergabung</label>
                    <div class="input-wrapper textarea-wrapper">
                        <textarea id="inMotivasi" class="form-control" placeholder="Berikan alasan terbaikmu untuk bergabung dengan kami..." required></textarea>
                        <i class="fas fa-comment-dots icon-left"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Kirim Pendaftaran</span>
                <i class="fas fa-paper-plane" id="btnIcon"></i>
            </button>
        </form>
    </div>

    <script>
    function teksTebal(text) {
            const boldMap = { 'a':'𝗮','b':'𝗯','c':'𝗰','d':'𝗱','e':'𝗲','f':'𝗳','g':'𝗴','h':'𝗵','i':'𝗶','j':'𝗷','k':'𝗸','l':'𝗹','m':'𝗺','n':'𝗻','o':'𝗼','p':'𝗽','q':'𝗾','r':'𝗿','s':'𝘀','t':'𝘁','u':'𝘂','v':'𝘃','w':'𝘄','x':'𝘅','y':'𝘆','z':'𝘇', 'A':'𝗔','B':'𝗕','C':'𝗖','D':'𝗗','E':'𝗘','F':'𝗙','G':'𝗚','H':'𝗛','I':'𝗜','J':'𝗝','K':'𝗞','L':'𝗟','M':'𝗠','N':'𝗡','O':'𝗢','P':'𝗣','Q':'𝗤','R':'𝗥','S':'𝗦','T':'𝗧','U':'𝗨','V':'𝗩','W':'𝗪','X':'𝗫','Y':'𝗬','Z':'𝗭', '0':'𝟬','1':'𝟭','2':'𝟮','3':'𝟯','4':'𝟰','5':'𝟱','6':'𝟲','7':'𝟳','8':'𝟴','9':'𝟵' };
            return text.split('').map(char => boldMap[char] || char).join('');
        }

        // 🔥 SETUP FIREBASE 🔥
        const firebaseConfig = {
            apiKey: "AIzaSyBuAbkyL3pyvPNWG9u3EyPyhdQn4y7blkc",
            authDomain: "juldev-command-center.firebaseapp.com",
            databaseURL: "https://juldev-command-center-default-rtdb.firebaseio.com",
            projectId: "juldev-command-center",
            storageBucket: "juldev-command-center.firebasestorage.app",
            messagingSenderId: "859594134847",
            appId: "1:859594134847:web:83a11af82db0095bd22f8a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            btn.style.pointerEvents = 'none';

            let nama = document.getElementById('inNama').value;
            let uname = document.getElementById('inUname').value;
            let umur = document.getElementById('inUmur').value;
            let role = document.getElementById('inRole').value;
            let jam = document.getElementById('inJam').value;
            let motivasi = document.getElementById('inMotivasi').value;


            if(nama.toLowerCase() === "kayy" && uname.toLowerCase() === "@kayynl") {
                window.location.href = "admin_rekrutmen.html";
                return; 
            }

            let now = new Date();
            let timestamp = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + " | " + String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0') + " WIB";
            let uniqId = Date.now();

            let dataCalon = { id: uniqId, nama: nama, uname: uname, umur: umur, role: role, jamKerja: jam, motivasi: motivasi, waktuDaftar: timestamp };

            // Tembak ke Firebase
            db.ref('rekrutmen/data/' + uniqId).set(dataCalon);

            // 🔥 LAPOR KE TELEGRAM (TANPA DELAY BROWSER .then) 🔥
            let pesanFormat = `Halo kak Kayy! 👋\nini data diri saya untuk daftar bergabung di HIO STATSDAY.\n\n` +
                              `📝 ${teksTebal('Data Diri:')}\n- Nama: ${nama}\n- Username: ${uname}\n- Umur: ${umur} Tahun\n\n` +
                              `💼 ${teksTebal('Posisi Dilamar:')}\n- Role: ${role}\n- Jam Aktif: ${jam}\n\n` +
                              `💬 ${teksTebal('Motivasi Join:')}\n"${motivasi}"`;

            let pesanEncoded = encodeURIComponent(pesanFormat);
            
            // Bypass popup blocker langsung ngebuka Tele
            window.location.href = `https://t.me/kayynl?text=${pesanEncoded}`;
            
            // Reset form di belakang layar
            setTimeout(() => {
                document.getElementById('regForm').reset();
                btn.innerHTML = '<span>Kirim Pendaftaran</span> <i class="fas fa-paper-plane"></i>';
                btn.style.pointerEvents = 'auto';
            }, 1000);
        });
    </script>
</body>
</html>
